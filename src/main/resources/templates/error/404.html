<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada | Geosinergia</title>
    <link rel="stylesheet" th:href="@{/css/errores.css}">
</head>

<body class="error-page error-404">

    <main class="error-card">

        <!-- Encabezado corporativo -->
        <header class="error-header">
            <img th:src="@{/img/login/geosinergia-logo.png}" alt="Geosinergia" class="error-logo">
        </header>

        <!-- Contenido del error -->
        <section class="error-content">

            <div class="error-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                    <path d="M14 2v6h6" />
                    <path d="M9 13h.01" />
                    <path d="M15 13h.01" />
                    <path d="M9 18c1.5-2 4.5-2 6 0" />
                </svg>
            </div>

            <p class="error-code">ERROR 404</p>

            <h1>Página no encontrada</h1>

            <p class="error-description">
                La página que estás buscando no existe
                o ya no se encuentra disponible.
                Verifica la dirección e inténtalo nuevamente.
            </p>

            <a th:href="@{/}" class="error-button">
                Volver al inicio
            </a>

        </section>

    </main>

</body>

</html>
