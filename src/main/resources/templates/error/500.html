<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error interno | Geosinergia</title>
    <link rel="stylesheet" th:href="@{/css/errores.css}">
</head>

<body class="error-page error-500">

    <main class="error-card">

        <!-- Encabezado corporativo -->
        <header class="error-header">
            <img th:src="@{/img/login/geosinergia-logo.png}" alt="Geosinergia" class="error-logo">
        </header>

        <!-- Contenido del error -->
        <section class="error-content">

            <div class="error-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="3" width="18" height="18" rx="3" />
                    <path d="M12 7v6" />
                    <path d="M12 17h.01" />
                </svg>
            </div>

            <p class="error-code">ERROR 500</p>

            <h1>Error interno del servidor</h1>

            <p class="error-description">
                Ocurrió un problema inesperado al procesar
                tu solicitud. Por favor, inténtalo nuevamente
                más tarde.
            </p>

            <a th:href="@{/}" class="error-button">
                Volver al inicio
            </a>

        </section>

    </main>

</body>

</html>
