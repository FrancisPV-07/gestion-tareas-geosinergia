<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud incorrecta | Geosinergia</title>
    <link rel="stylesheet" th:href="@{/css/errores.css}">
</head>

<body class="error-page error-400">

    <main class="error-card">

        <header class="error-header">
            <img th:src="@{/img/login/geosinergia-logo.png}" alt="Geosinergia" class="error-logo">
        </header>

        <section class="error-content">

            <div class="error-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10" />
                    <path d="M12 7v6" />
                    <path d="M12 17h.01" />
                </svg>
            </div>

            <p class="error-code">ERROR 400</p>

            <h1>Solicitud incorrecta</h1>

            <p class="error-description">
                No pudimos procesar tu solicitud.
                Verifica la información e inténtalo nuevamente.
            </p>

            <a th:href="@{/}" class="error-button">
                Volver al inicio
            </a>

        </section>

    </main>

</body>

</html>
