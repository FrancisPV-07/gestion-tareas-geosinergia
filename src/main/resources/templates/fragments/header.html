<header class="topbar" xmlns:th="http://www.thymeleaf.org" th:fragment="header">

    <!-- ==================================================
         IZQUIERDA
         ================================================== -->
    <div class="topbar-left">
        <button type="button" class="menu-button" id="sidebarToggle" aria-label="Contraer menú lateral"
            aria-expanded="true">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 6h16" />

                <path d="M4 12h16" />

                <path d="M4 18h16" />
            </svg>
        </button>

        <div class="topbar-divider"></div>

        <div class="system-title">
            <strong>
                Sistema de Gestión de Tareas
            </strong>

            <span>
                Organiza, asigna y da seguimiento al trabajo de tu equipo.
            </span>
        </div>
    </div>

    <!-- ==================================================
         DERECHA
         ================================================== -->
    <div class="topbar-right">
        <!-- NOTIFICACIONES -->
        <button type="button" class="notification-button" aria-label="Notificaciones">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9" />

                <path d="M10 21h4" />
            </svg>
            <span class="notification-dot"></span>
        </button>

        <div class="topbar-divider"></div>

        <!-- USUARIO -->
        <details class="user-menu">
            <summary>
                <div class="user-avatar" th:text="${inicialesUsuario}">
                    FP
                </div>

                <div class="user-info">
                    <strong th:text="${nombreUsuario}">
                        Usuario
                    </strong>

                    <span th:text="${rolUsuario == 'COORDINADOR'
                        ? 'Coordinador'
                        : 'Colaborador'}">
                        Rol
                    </span>
                </div>

                <span class="user-arrow">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="m7 9 5 5 5-5" />
                    </svg>
                </span>
            </summary>

            <!-- ==================================================
                 MENÚ DESPLEGABLE
                 ================================================== -->
            <div class="user-dropdown">
                <div class="dropdown-user">
                    <strong th:text="${nombreUsuario}">
                        Usuario
                    </strong>

                    <span th:text="${correoUsuario}">
                        correo@geosinergia.com
                    </span>
                </div>

                <div class="dropdown-divider"></div>

                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="logout-button">
                        Cerrar sesión
                    </button>
                </form>
            </div>
        </details>
    </div>
</header>
